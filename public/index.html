  /* Neo-Brutalist Custom Scrollbar */
  :root {
    --sb-track: #FFFDF8;
    --sb-thumb: #FFE600;
    --sb-thumb-hover: #FF3366;
    --sb-thumb-active: #00F0FF;
    --sb-border: #000000;
  }
  html {
    scrollbar-color: var(--sb-thumb) var(--sb-track);
    scrollbar-width: auto;
  }
  ::-webkit-scrollbar {
    width: 16px;
    height: 16px;
  }
  ::-webkit-scrollbar-track {
    background: var(--sb-track);
    border-left: 3px solid var(--sb-border);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb);
    border: 3px solid var(--sb-border);
    border-radius: 0px !important;
    box-shadow: inset -2px -2px 0px rgba(0, 0, 0, 0.4), inset 2px 2px 0px rgba(255, 255, 255, 0.6);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--sb-thumb-hover);
  }
  ::-webkit-scrollbar-thumb:active {
    background: var(--sb-thumb-active);
  }
  ::-webkit-scrollbar-corner {
    background: var(--sb-track);
    border: 3px solid var(--sb-border);
  }
  ::-webkit-scrollbar-button:single-button {
    background: var(--sb-thumb);
    border-left: 3px solid var(--sb-border);
    display: block;
    height: 16px;
    width: 16px;
  }
  ::-webkit-scrollbar-button:single-button:vertical:decrement {
    border-bottom: 2px solid var(--sb-border);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='5,2 1,8 9,8' fill='%23000'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
  }
  ::-webkit-scrollbar-button:single-button:vertical:increment {
    border-top: 2px solid var(--sb-border);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='5,8 1,2 9,2' fill='%23000'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
  }
  ::-webkit-scrollbar-button:hover {
    background-color: var(--sb-thumb-hover);
  }

  /* Neo-Brutalist Top Scroll Progress Bar */
  #neo-scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 5px;
    width: 0%;
    background: #FFE600;
    border-bottom: 2px solid #000;
    z-index: 99999;
    pointer-events: none;
    transition: width 0.05s ease-out;
  }

  /* Neo-Brutalist Back to Top Button */
  #neo-back-to-top {
    position: fixed;
    bottom: 24px;
    right: 28px;
    z-index: 999;
    display: none;
    background: #FFE600;
    color: #000;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 10px 16px;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
  }
  #neo-back-to-top:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #000;
    background: #FF3366;
    color: #fff;
  }
  #neo-back-to-top:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #000;
  }

<script>
(function() {
  function updateScroll() {
    var h = document.documentElement;
    var b = document.body;
    var st = window.pageYOffset || h.scrollTop || b.scrollTop || 0;
    var sh = Math.max(h.scrollHeight, b.scrollHeight);
    var ch = h.clientHeight || window.innerHeight;
    var scrollRange = sh - ch;
    var percent = scrollRange > 0 ? (st / scrollRange) * 100 : 0;
    var prog = document.getElementById('neo-scroll-progress');
    if (prog) prog.style.width = Math.min(100, Math.max(0, percent)) + '%';
    var btn = document.getElementById('neo-back-to-top');
    if (btn) btn.style.display = st > 250 ? 'block' : 'none';
  }
  window.addEventListener('scroll', updateScroll, { passive: true });
  window.addEventListener('resize', updateScroll);
  document.addEventListener('DOMContentLoaded', updateScroll);
})();
</script>

  window.__parallaxEnhanced = true;
  let lastScrollY = window.scrollY;
  const outlineWords = () => document.querySelectorAll('.outline-word');
  const parallaxEls = () => document.querySelectorAll('[data-parallax]');

  window.addEventListener('scroll', () => {
    const sy = window.scrollY;
    // Dynamic drifting of giant background typography
    document.querySelectorAll('.outline-word').forEach((el, i) => {
      const speed = i % 2 === 0 ? 0.35 : -0.25;
      el.style.transform = `translate3d(${sy * speed * 0.4}px, 0, 0)`;
    });
    // Dynamic subtle rotation of stickers on scroll
    document.querySelectorAll('.parallax-el:not([data-scale])').forEach((el, idx) => {

  }, { passive: true });
</script>
<script>
(function() {
  function initHeroParallax() {
    var card = document.querySelector('.hero-card-container');
    if (!card) return;
    var bg = card.querySelector('.hero-bg-layer');
    var portrait = card.querySelector('.hero-portrait-layer');
    var badge = card.querySelector('.hero-badge-layer');

    var targetX = 0, targetY = 0;
    var currentX = 0, currentY = 0;

    window.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      targetX = Math.max(-1, Math.min(1, (e.clientX - cx) / (window.innerWidth / 2)));
      targetY = Math.max(-1, Math.min(1, (e.clientY - cy) / (window.innerHeight / 2)));
    }, { passive: true });

    window.addEventListener('mouseleave', function() {
      targetX = 0; targetY = 0;
    });

    function loop() {
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      var tiltX = -currentY * 8;
      var tiltY = currentX * 8;
      card.style.transform = 'perspective(900px) rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)';

      if (bg) {
        bg.style.transform = 'translate3d(' + (-currentX * 26).toFixed(2) + 'px, ' + (-currentY * 26).toFixed(2) + 'px, 0) scale(1.15)';
      }
      if (portrait) {
        portrait.style.transform = 'translate3d(' + (currentX * 22).toFixed(2) + 'px, ' + (currentY * 22).toFixed(2) + 'px, 0) scale(1.03)';
      }
      if (badge) {
        badge.style.transform = 'translate3d(' + (currentX * 38).toFixed(2) + 'px, ' + (currentY * 38).toFixed(2) + 'px, 0)';
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeroParallax);
  } else {
    initHeroParallax();
  }
})();
</script>

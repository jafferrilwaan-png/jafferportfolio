<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('color-scheme');
        // ALWAYS DEFAULT TO CLEAN WHITE (LIGHT) MODE WHEN OPENING PORTFOLIO
        var isDark = stored === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.content = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.content = 'light';
        }
      } catch (e) {}
    })();
  </script>

.blueprint-bg{
  background-color:#FFF4E4;
  background-image:
    linear-gradient(rgba(0,0,0,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.055) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,.16) 2px, transparent 2px),
    linear-gradient(90deg, rgba(0,0,0,.16) 2px, transparent 2px);
  background-size:40px 40px, 40px 40px, 200px 200px, 200px 200px;
  background-position:0 0, 0 0, 0 0, 0 0;
  animation:gridDrift 14s linear infinite;
}

@keyframes gridDrift{
  from{
    background-position:0 0,0 0,0 0,0 0
  }

  to{
    background-position:40px 40px,40px 40px,40px 40px,40px 40px

}

  box-shadow:12px 12px 0 #000
}

.lift{
  transition:transform .18s ease, box-shadow .18s ease
}

.lift:hover{
  transform:translate(-4px,-4px);
  box-shadow:12px 12px 0 #000
}

.press{
  transition:transform .1s ease, box-shadow .1s ease
}

.press:hover{
  animation:btnWiggle .32s ease-in-out;
  box-shadow:10px 10px 0 #000
}

@keyframes btnWiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-1.2deg) translate(-1px,-1px)
  }

  75%{
    transform:rotate(1.2deg) translate(1px,-1px)
  }
}

.press:active{
  transform:translate(8px,8px);
  box-shadow:0 0 0 #000
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

.marquee-track{
  animation:marquee 22s linear infinite;
  will-change:transform
}

.marquee-pause:hover .marquee-track{
  animation-play-state:paused
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

.spin-slow{
  animation:spinSlow 18s linear infinite
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-3deg)
  }

  50%{
    transform:translateY(-5px) rotate(-1deg)
  }
}

.floaty{
  animation:floaty 3.2s ease-in-out infinite
}

@keyframes badgeWiggle{
  0%,82%,100%{
    transform:rotate(-3deg)
  }

  84%{
    transform:rotate(3deg)
  }

  88%{
    transform:rotate(-5deg)
  }

  92%{
    transform:rotate(2deg)
  }

  96%{
    transform:rotate(-3deg)
  }
}

.wiggle-badge{
  animation:badgeWiggle 3s ease-in-out infinite
}

  0%{
    opacity:0;
    transform:translateY(12px) scale(.96) rotate(-2deg)
  }

  60%{
    opacity:1;
    transform:translateY(-2px) scale(1.02) rotate(1deg)
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1) rotate(0)
  }

  /* Neo-Brutalist Custom Scrollbar */
  :root {
    --sb-track: #FFFDF8;
    --sb-thumb: #FFE600;
    --sb-thumb-hover: #FF3366;
    --sb-thumb-active: #00F0FF;
    --sb-border: #000000;
  }
  html {
    scrollbar-color: var(--sb-thumb) var(--sb-track);
    scrollbar-width: auto;
  }
  ::-webkit-scrollbar {
    width: 16px;
    height: 16px;
  }
  ::-webkit-scrollbar-track {
    background: var(--sb-track);
    border-left: 3px solid var(--sb-border);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb);
    border: 3px solid var(--sb-border);
    border-radius: 0px !important;
    box-shadow: inset -2px -2px 0px rgba(0, 0, 0, 0.4), inset 2px 2px 0px rgba(255, 255, 255, 0.6);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--sb-thumb-hover);
  }
  ::-webkit-scrollbar-thumb:active {
    background: var(--sb-thumb-active);
  }
  ::-webkit-scrollbar-corner {
    background: var(--sb-track);
    border: 3px solid var(--sb-border);
  }
  ::-webkit-scrollbar-button:single-button {
    background: var(--sb-thumb);
    border-left: 3px solid var(--sb-border);
    display: block;
    height: 16px;
    width: 16px;
  }
  ::-webkit-scrollbar-button:single-button:vertical:decrement {
    border-bottom: 2px solid var(--sb-border);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='5,2 1,8 9,8' fill='%23000'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
  }
  ::-webkit-scrollbar-button:single-button:vertical:increment {
    border-top: 2px solid var(--sb-border);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><polygon points='5,8 1,2 9,2' fill='%23000'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
  }
  ::-webkit-scrollbar-button:hover {
    background-color: var(--sb-thumb-hover);
  }

  /* Neo-Brutalist Top Scroll Progress Bar */
  #neo-scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 5px;
    width: 0%;
    background: #FFE600;
    border-bottom: 2px solid #000;
    z-index: 99999;
    pointer-events: none;
    transition: width 0.05s ease-out;
  }

  /* Neo-Brutalist Back to Top Button */
  #neo-back-to-top {
    position: fixed;
    bottom: 24px;
    right: 28px;
    z-index: 999;
    display: none;
    background: #FFE600;
    color: #000;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 10px 16px;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
  }
  #neo-back-to-top:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #000;
    background: #FF3366;
    color: #fff;
  }
  #neo-back-to-top:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #000;
  }


  /* Fix hero card container height */
  .hero-card-container {
    height: 460px !important;
    min-height: 460px !important;
    position: relative !important;
    display: block !important;
  }
  @media (max-width: 640px) {
    .hero-card-container {
      height: 380px !important;
      min-height: 380px !important;
    }
  }


  /* =========================================================
     FRAMER MOTION-LIKE SPRING PHYSICS & MICRO-INTERACTIONS
     ========================================================= */
  :root {
    --framer-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --framer-snappy: cubic-bezier(0.16, 1, 0.3, 1);
    --framer-gentle: cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Spring Card Hover & Lift */
  .lift {
    transition: transform 0.4s var(--framer-spring), box-shadow 0.4s var(--framer-spring), border-color 0.2s ease !important;
    will-change: transform, box-shadow;
  }
  .lift:hover {
    transform: translate3d(-6px, -6px, 0) scale(1.018) !important;
    box-shadow: 14px 14px 0 #000 !important;
  }
  .lift:active {
    transform: translate3d(2px, 2px, 0) scale(0.985) !important;
    box-shadow: 4px 4px 0 #000 !important;
    transition: transform 0.1s var(--framer-snappy), box-shadow 0.1s var(--framer-snappy) !important;
  }

  /* Bouncy Spring Buttons & Interactive Badges */
  .press {
    transition: transform 0.35s var(--framer-spring), box-shadow 0.35s var(--framer-spring), background-color 0.15s ease !important;
    will-change: transform, box-shadow;
  }
  .press:hover {
    transform: translate3d(-4px, -4px, 0) scale(1.035) !important;
    box-shadow: 10px 10px 0 #000 !important;
  }
  .press:active {
    transform: translate3d(4px, 4px, 0) scale(0.96) !important;
    box-shadow: 2px 2px 0 #000 !important;
    transition: transform 0.08s var(--framer-snappy), box-shadow 0.08s var(--framer-snappy) !important;
  }

  /* Staggered Scroll Spring Reveal (Framer whileInView) */
  .reveal {
    opacity: 0;
    transform: translate3d(0, 36px, 0) scale(0.96);
    transition: opacity 0.7s var(--framer-snappy), transform 0.75s var(--framer-spring) !important;
    will-change: opacity, transform;
  }
  .reveal.is-in {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1) !important;
  }

  /* Elastic Wiggle on Badges & Tags */
  .wiggle-badge {
    transition: transform 0.45s var(--framer-spring) !important;
  }
  .wiggle-badge:hover {
    transform: rotate(6deg) scale(1.12) !important;
  }

  /* Hero Card Interactive Spring */
  .hero-card-container {
    transition: box-shadow 0.35s var(--framer-spring) !important;
  }
  .hero-card-container:hover {
    box-shadow: 12px 12px 0 #000 !important;
  }

  /* Magnetic snap element class */
  .framer-magnetic {
    display: inline-block;
    transition: transform 0.25s var(--framer-spring);
    will-change: transform;
  }


  /* =========================================================
     MULTI-MOTION SUITE: ADVANCED SMOOTH SPRING INTERACTIONS
     ========================================================= */

  /* Distinct Harmonic Floating Keyframes */
  @keyframes smoothFloatA {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -8px, 0) rotate(1.5deg); }
  }
  @keyframes smoothFloatB {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(-4px, -10px, 0) rotate(-2deg); }
  }
  @keyframes smoothFloatC {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(4px, -7px, 0) rotate(2.5deg); }
  }

  .floaty {
    animation: smoothFloatA 3.6s ease-in-out infinite !important;
    will-change: transform;
  }
  .tape-sticker {
    animation: smoothFloatB 4.2s ease-in-out infinite !important;
    will-change: transform;
  }
  .float-shape {
    animation: smoothFloatC 3.1s ease-in-out infinite !important;
    will-change: transform;
  }

  /* Shimmer sweep across filled skill bars */
  @keyframes skillShimmerSweep {
    0% { transform: translateX(-100%); }
    50%, 100% { transform: translateX(200%); }
  }
  .skill-fill {
    position: relative;
    overflow: hidden;
  }
  .skill-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    animation: skillShimmerSweep 3s ease-in-out infinite;
    pointer-events: none;
  }

  /* 3D Card Specular Sheen Layer */
  .sheen-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    border-radius: inherit;
    transition: opacity 0.3s ease;
    mix-blend-mode: overlay;
    z-index: 5;
  }
  .card-3d-active .sheen-overlay {
    opacity: 1;
  }

  /* When custom cursor is active on desktop, completely remove the OS arrow cursor */
  @media (hover: hover) and (pointer: fine) {
    *, *::before, *::after {
      cursor: none !important;
    }
  }

  /* Neo-Brutalist Box Cursor (Acts as the primary cursor) */
  #neo-custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 16px;
    height: 16px;
    background: #FFE600;
    border: 2px solid #000;
    box-shadow: 2px 2px 0 #000;
    pointer-events: none;
    z-index: 9999999;
    border-radius: 0px;
    transform: translate(-50%, -50%);
    transition: width 0.2s var(--framer-spring), height 0.2s var(--framer-spring), background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    opacity: 0;
    will-change: transform, width, height;
  }
  #neo-custom-cursor.is-hovering {
    width: 34px;
    height: 34px;
    background: #FF3366;
    box-shadow: 3px 3px 0 #000;

  #neo-custom-cursor.is-text {
    width: 4px;
    height: 22px;
    background: #000;
    border: none;
    box-shadow: none;

<script>
(function() {
  function updateScroll() {
    var h = document.documentElement;
    var b = document.body;
    var st = window.pageYOffset || h.scrollTop || b.scrollTop || 0;
    var sh = Math.max(h.scrollHeight, b.scrollHeight);
    var ch = h.clientHeight || window.innerHeight;
    var scrollRange = sh - ch;
    var percent = scrollRange > 0 ? (st / scrollRange) * 100 : 0;
    var prog = document.getElementById('neo-scroll-progress');
    if (prog) prog.style.width = Math.min(100, Math.max(0, percent)) + '%';
    var btn = document.getElementById('neo-back-to-top');
    if (btn) btn.style.display = st > 250 ? 'block' : 'none';
  }
  window.addEventListener('scroll', updateScroll, { passive: true });
  window.addEventListener('resize', updateScroll);
  document.addEventListener('DOMContentLoaded', updateScroll);
})();
</script>

<script>
(function() {
  function startHeroParallax() {
    var card = document.querySelector('.hero-card-container');
    if (!card) {
      setTimeout(startHeroParallax, 100);
      return;
    }
    var bg = card.querySelector('.hero-bg-layer');
    var portrait = card.querySelector('.hero-portrait-layer');
    var badge = card.querySelector('.hero-badge-layer');

    var targetX = 0, targetY = 0;
    var currentX = 0, currentY = 0;

    // Desktop: Mouse Move
    window.addEventListener('mousemove', function(e) {
      var rect = card.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      targetX = Math.max(-1, Math.min(1, (e.clientX - cx) / (window.innerWidth / 2)));
      targetY = Math.max(-1, Math.min(1, (e.clientY - cy) / (window.innerHeight / 2)));
    }, { passive: true });

    window.addEventListener('mouseleave', function() {
      targetX = 0; targetY = 0;
    });

    // Mobile: Gyroscope tilt interaction
    function handleOrientation(e) {
      if (e.gamma === null || e.beta === null) return;
      // Gamma: Left/Right tilt (-90 to +90). Full response around +/- 22 degrees
      var gx = Math.max(-1, Math.min(1, e.gamma / 22));
      // Beta: Front/Back tilt. Natural reading angle is ~45 degrees.
      var gy = Math.max(-1, Math.min(1, (e.beta - 45) / 22));
      targetX = gx;
      targetY = gy;
    }

    if (window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        var askGyro = function() {
          DeviceOrientationEvent.requestPermission().then(function(state) {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, { passive: true });
            }
          }).catch(function() {});
          window.removeEventListener('touchstart', askGyro);
          window.removeEventListener('click', askGyro);
        };
        window.addEventListener('touchstart', askGyro, { passive: true });
        window.addEventListener('click', askGyro, { passive: true });
      } else {
        window.addEventListener('deviceorientation', handleOrientation, { passive: true });
      }
    }

    // Mobile: Touch Move fallback
    window.addEventListener('touchmove', function(e) {
      if (e.touches && e.touches[0]) {
        var t = e.touches[0];
        var rect = card.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        targetX = Math.max(-1, Math.min(1, (t.clientX - cx) / (window.innerWidth / 2)));
        targetY = Math.max(-1, Math.min(1, (t.clientY - cy) / (window.innerHeight / 2)));
      }
    }, { passive: true });

    function loop() {
      currentX += (targetX - currentX) * 0.12;
      currentY += (targetY - currentY) * 0.12;

      var tiltX = -currentY * 8;
      var tiltY = currentX * 8;
      card.style.transform = 'perspective(900px) rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)';

      if (bg) {
        bg.style.transform = 'translate3d(' + (-currentX * 26).toFixed(2) + 'px, ' + (-currentY * 26).toFixed(2) + 'px, 0) scale(1.15)';
      }
      if (portrait) {
        portrait.style.transform = 'translate3d(' + (currentX * 22).toFixed(2) + 'px, ' + (currentY * 22).toFixed(2) + 'px, 0) scale(1.03)';
      }
      if (badge) {
        badge.style.transform = 'translate3d(' + (currentX * 38).toFixed(2) + 'px, ' + (currentY * 38).toFixed(2) + 'px, 0)';
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  startHeroParallax();
})();
</script>


<script>
(function() {
  function initFramerMotionEffects() {
    // 1. Magnetic button interaction (Framer Motion magnetic pull effect)
    var magneticTargets = document.querySelectorAll('button:not(#neo-back-to-top), a.press, .wiggle-badge, input[type="submit"]');
    magneticTargets.forEach(function(el) {
      el.addEventListener('mousemove', function(e) {
        var rect = el.getBoundingClientRect();
        var x = e.clientX - rect.left - rect.width / 2;
        var y = e.clientY - rect.top - rect.height / 2;
        // Subtle magnetic pull (max 6px displacement)
        var pullX = Math.max(-8, Math.min(8, x * 0.22));
        var pullY = Math.max(-8, Math.min(8, y * 0.22));
        el.style.transform = 'translate3d(' + pullX.toFixed(1) + 'px, ' + pullY.toFixed(1) + 'px, 0) scale(1.03)';
      }, { passive: true });

      el.addEventListener('mouseleave', function() {
        el.style.transform = '';
      });
    });

    // 2. Smooth spring stagger on project cards
    var cards = document.querySelectorAll('article.lift, .project-card');
    cards.forEach(function(card, idx) {
      card.style.transitionDelay = (idx * 0.05) + 's';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(initFramerMotionEffects, 250);
    });
  } else {
    setTimeout(initFramerMotionEffects, 250);
  }
})();
</script>

<script>
(function() {
  function initMultiMotionSuite() {
    // -----------------------------------------------------------------
    // 1. Smooth 3D Card Hover Physics with Specular Glare (Works Section)
    // -----------------------------------------------------------------
    var cards = document.querySelectorAll('article.lift');
    cards.forEach(function(card) {
      // Inject specular sheen overlay if not present
      if (!card.querySelector('.sheen-overlay')) {
        var sheen = document.createElement('div');
        sheen.className = 'sheen-overlay';
        card.style.position = 'relative';
        card.appendChild(sheen);
      }

      var currentRotX = 0, currentRotY = 0;
      var targetRotX = 0, targetRotY = 0;
      var isHovered = false;
      var sheenEl = card.querySelector('.sheen-overlay');

      card.addEventListener('mouseenter', function() {
        isHovered = true;
        card.classList.add('card-3d-active');
      });

      card.addEventListener('mousemove', function(e) {
        var rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var normX = (x / rect.width) * 2 - 1;
        var normY = (y / rect.height) * 2 - 1;

        // Subtle 3D tilt
        targetRotX = -normY * 6; // max 6 deg tilt
        targetRotY = normX * 6;

        // Move specular sheen highlight
        if (sheenEl) {
          sheenEl.style.background = 'radial-gradient(circle 260px at ' + x + 'px ' + y + 'px, rgba(255,255,255,0.4), transparent 70%)';
        }
      }, { passive: true });

      card.addEventListener('mouseleave', function() {
        isHovered = false;
        targetRotX = 0;
        targetRotY = 0;
        card.classList.remove('card-3d-active');
      });

      function animateCard() {
        currentRotX += (targetRotX - currentRotX) * 0.14;
        currentRotY += (targetRotY - currentRotY) * 0.14;

        if (isHovered || Math.abs(currentRotX) > 0.05 || Math.abs(currentRotY) > 0.05) {
          card.style.transform = 'perspective(900px) rotateX(' + currentRotX.toFixed(2) + 'deg) rotateY(' + currentRotY.toFixed(2) + 'deg) translate3d(-3px, -3px, 0)';
        } else if (!isHovered && Math.abs(currentRotX) <= 0.05 && Math.abs(currentRotY) <= 0.05) {
          card.style.transform = '';
        }
        requestAnimationFrame(animateCard);
      }
      requestAnimationFrame(animateCard);
    });

    // -----------------------------------------------------------------
    // 2. Silky Smooth Neo-Brutalist Cursor Box (Desktop Only - Acts as Cursor)
    // -----------------------------------------------------------------
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      var cursor = document.getElementById('neo-custom-cursor');
      if (!cursor) {
        cursor = document.createElement('div');
        cursor.id = 'neo-custom-cursor';
        document.body.appendChild(cursor);
      }

      var mouseX = -100, mouseY = -100;
      var posX = -100, posY = -100;
      var hasMoved = false;
      var isMouseDown = false;

      window.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!hasMoved) {
          hasMoved = true;
          posX = mouseX;
          posY = mouseY;
          cursor.style.opacity = '1';
        }
      }, { passive: true });

      window.addEventListener('mousedown', function() {
        isMouseDown = true;
      });

      window.addEventListener('mouseup', function() {
        isMouseDown = false;
      });

      window.addEventListener('mouseleave', function() {
        cursor.style.opacity = '0';
      });
      window.addEventListener('mouseenter', function() {
        cursor.style.opacity = '1';
      });

      // Expand on hoverable clickable elements
      var hoverables = document.querySelectorAll('a, button, summary, [role="button"], .lift, .press, .wiggle-badge');
      hoverables.forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          cursor.classList.add('is-hovering');
        });
        el.addEventListener('mouseleave', function() {
          cursor.classList.remove('is-hovering');
        });
      });

      // Text inputs morph cursor into sharp brutalist text bar
      var textInputs = document.querySelectorAll('input, textarea');
      textInputs.forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          cursor.classList.add('is-text');
        });
        el.addEventListener('mouseleave', function() {
          cursor.classList.remove('is-text');
        });
      });

      // High responsiveness RAF loop (0.65 lerp gives silky inertia with zero noticeable lag)
      function renderCursor() {
        posX += (mouseX - posX) * 0.65;
        posY += (mouseY - posY) * 0.65;
        var scale = isMouseDown ? ' scale(0.8)' : '';
        cursor.style.transform = 'translate3d(' + posX.toFixed(1) + 'px, ' + posY.toFixed(1) + 'px, 0) translate(-50%, -50%)' + scale;
        requestAnimationFrame(renderCursor);
      }
      requestAnimationFrame(renderCursor);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(initMultiMotionSuite, 300);
    });
  } else {
    setTimeout(initMultiMotionSuite, 300);
  }
})();
</script>


<script id="neo-dark-mode-script">
(function() {
  function syncThemeUI(isDark) {
    var btns = document.querySelectorAll('.neo-theme-toggle-btn');
    btns.forEach(function(btn) {
      var icon = btn.querySelector('.theme-icon');
      var label = btn.querySelector('.theme-label');
      if (icon) icon.textContent = isDark ? '☀' : '☾';
      if (label) label.textContent = isDark ? 'LIGHT' : 'DARK';
    });
  }

  function toggleTheme() {
    var isDark = document.documentElement.classList.toggle('dark');
    var targetScheme = isDark ? 'dark' : 'light';
    try {
      localStorage.setItem('color-scheme', targetScheme);
    } catch(e) {}
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.content = targetScheme;
    syncThemeUI(isDark);
  }

  function mountThemeToggle() {
    // Look for navbar button group
    var navContainer = document.querySelector('header nav .flex.items-center.gap-2') ||
                       document.querySelector('header .flex.items-center.gap-2') ||
                       document.querySelector('header nav');
                       
    if (!navContainer) {
      setTimeout(mountThemeToggle, 120);
      return;
    }

    if (document.getElementById('neo-theme-toggle')) return;

    var btn = document.createElement('button');
    btn.id = 'neo-theme-toggle';
    btn.className = 'neo-theme-toggle-btn press hard-sm flex h-11 md:h-12 items-center justify-center gap-1.5 md:gap-2 border-[3px] border-black bg-white px-2.5 md:px-3 text-xs md:text-sm font-black uppercase text-black shadow-[3px_3px_0_#000] hover:bg-[#FFE600] transition-colors';
    btn.setAttribute('aria-label', 'Toggle Dark / Light Mode');
    btn.setAttribute('title', 'Toggle Dark / Light Mode');

    var isDark = document.documentElement.classList.contains('dark');
    btn.innerHTML = '<span class="theme-icon text-base leading-none">' + (isDark ? '☀' : '☾') + '</span><span class="theme-label hidden sm:inline">' + (isDark ? 'LIGHT' : 'DARK') + '</span>';

    btn.addEventListener('click', toggleTheme);

    // Insert next to Hire Me button or menu toggle
    navContainer.insertBefore(btn, navContainer.firstChild);
  }

  // System scheme sync if user hasn't locked an override
  // Light mode by default; toggles only on user click

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(mountThemeToggle, 200);
    });
  } else {
    setTimeout(mountThemeToggle, 200);
  }
})();
</script>
